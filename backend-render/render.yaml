services:
  - type: web
    name: revision-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_UPLOAD_BUCKET
        value: lecture-files
      - key: AI_PROVIDER
        value: gemini
